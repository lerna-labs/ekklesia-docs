<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url={{ page.redirect_to }}">
  <link rel="canonical" href="{{ page.redirect_to }}">
  <meta name="robots" content="noindex">
  <title>Moved: {{ page.title }}</title>
</head>
<body>
  <p>
    This page has moved to
    <a href="{{ page.redirect_to }}">{{ page.redirect_to }}</a>.
  </p>
  <script>window.location.replace({{ page.redirect_to | jsonify }});</script>
</body>
</html>
