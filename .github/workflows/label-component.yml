name: Label component

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply the component label
        uses: actions/github-script@v7
        with:
          script: |
            const COMPONENTS = [
              'frontend',
              'backend',
              'hydra',
              'helpers',
              'proposal-module',
              'rewards',
              'docs',
            ];

            const body = context.payload.issue.body || '';

            // Issue forms render each field as a "### Label" heading followed
            // by its value. Read the value under the Component heading only.
            const match = body.match(/^###\s+Component\s*$\n+([^\n]+)/m);
            if (!match) {
              core.info('No component field on this issue, leaving labels alone.');
              return;
            }

            const value = match[1].trim().toLowerCase();
            const wanted = COMPONENTS.includes(value) ? value : null;

            if (!wanted) {
              core.info(`Component reported as "${value}", needs manual triage.`);
            }

            const current = context.payload.issue.labels.map((l) => l.name);
            const stale = current.filter((l) => COMPONENTS.includes(l) && l !== wanted);

            // An issue can be edited to point at a different component, so
            // clear any component label that no longer applies.
            for (const name of stale) {
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: context.issue.number,
                name,
              });
              core.info(`Removed ${name}.`);
            }

            const add = [];
            if (wanted && !current.includes(wanted)) {
              add.push(wanted);
            }
            if (!wanted && !current.includes('needs-triage')) {
              add.push('needs-triage');
            }
            if (wanted && current.includes('needs-triage')) {
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: context.issue.number,
                name: 'needs-triage',
              });
            }

            if (add.length) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: context.issue.number,
                labels: add,
              });
              core.info(`Added ${add.join(', ')}.`);
            }
