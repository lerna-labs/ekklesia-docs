name: Deploy to GitHub Pages

# Publishing is tied to a release rather than to every merge, so what is
# live always corresponds to a version and a changelog entry. Merging to
# main accumulates changes; cutting the release publishes them.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy (e.g., upstream API change detected)"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Build the tag that was released, not whatever main has drifted
          # to since. A manual run falls back to the default branch.
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Format markdown
        run: npm run fmt

      - name: Validate OpenAPI specs
        run: npm run lint:specs

      - name: Generate Postman collections
        run: npm run postman

      - name: Write the version data
        run: npm run version:data

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        run: bundle exec jekyll build --destination ./_site
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
