name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Mint a Release Manager token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_MANAGER_APP_ID }}
          private-key: ${{ secrets.RELEASE_MANAGER_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # With pending changesets this opens or refreshes the version pull
      # request. With none it does nothing, which is the state right after
      # that pull request merges, and the tagging steps below take over.
      - name: Open or refresh the version pull request
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version
          title: 'Release the documentation'
          commit: 'Version the documentation'
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}

      # The action writes its own description, which explains npm publishing
      # and addresses the reader directly. Neither fits here, so replace it.
      - name: Describe the release pull request
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ steps.changesets.outputs.pullRequestNumber }}
          BRANCH: changeset-release/${{ github.ref_name }}
        run: |
          git fetch --quiet origin "$BRANCH"
          version=$(git show "origin/$BRANCH:package.json" \
            | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          notes=$(git show "origin/$BRANCH:CHANGELOG.md" \
            | awk '/^## /{n++} n==1' | tail -n +2)
          {
            echo "Merging this releases documentation v${version}."
            echo
            echo "The site republishes on every merge to main, so this marks a"
            echo "version rather than making anything live. It versions the"
            echo "package, writes the changelog, tags v${version}, and publishes"
            echo "the release."
            echo
            echo "Accumulated since the last release:"
            echo
            echo "${notes}"
            echo
            echo "This description is rewritten as further entries land on main."
          } > release-pr-body.md
          gh pr edit "$PR" --body-file release-pr-body.md
          rm -f release-pr-body.md

      - name: Read the current version
        if: steps.changesets.outputs.hasChangesets == 'false'
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi

      # Reached only on the push that merged the version pull request, since
      # that is the first time this version exists without a tag.
      - name: Tag and publish the release
        if: >-
          steps.changesets.outputs.hasChangesets == 'false' &&
          steps.version.outputs.tagged == 'false'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes=$(awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2)
          if [ -z "$notes" ]; then
            notes="See CHANGELOG.md."
          fi
          gh release create "v$VERSION" \
            --title "Documentation v$VERSION" \
            --notes "$notes" \
            --target main
