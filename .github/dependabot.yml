version: 2
# Automatic pull requests are disabled: open-pull-requests-limit is 0 on every
# block below. Dependabot alerts stay enabled and are the signal; dependency
# updates land as maintainer-authored batches that carry a changeset, which an
# automated pull request cannot provide. Dependabot security updates are
# disabled in repository settings for the same reason.
#
# To re-enable, restore a non-zero open-pull-requests-limit here and turn
# Dependabot security updates back on in repository settings.
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 0
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      # Everything here is tooling for building and checking the site, so
      # these land together rather than as one pull request each.
      npm-dependencies:
        patterns: ['*']

  - package-ecosystem: 'bundler'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 0
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      jekyll:
        patterns: ['*']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    ignore:
      # The workflows track floating major tags on purpose. Dependabot reads
      # ruby/setup-ruby@v1 as version 1 and proposes an exact patch pin,
      # which would freeze it while the other actions keep floating.
      - dependency-name: 'ruby/setup-ruby'
