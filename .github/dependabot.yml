version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      # Everything here is tooling for building and checking the site, so
      # these land together rather than as one pull request each.
      npm-dependencies:
        patterns: ['*']

  - package-ecosystem: 'bundler'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      jekyll:
        patterns: ['*']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    ignore:
      # The workflows track floating major tags on purpose. Dependabot reads
      # ruby/setup-ruby@v1 as version 1 and proposes an exact patch pin,
      # which would freeze it while the other actions keep floating.
      - dependency-name: 'ruby/setup-ruby'
